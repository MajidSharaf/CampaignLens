services:

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    logging:
      driver: "none"

  weaviate:
    image: semitechnologies/weaviate:1.28.4
    container_name: weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

  mlflow:
    image: python:3.11-slim
    container_name: mlflow
    command: >
      bash -c "pip install 'mlflow==2.13.2' --quiet && mlflow server
      --host 0.0.0.0 --port 5001
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlflow/artifacts"
    ports:
      - "5001:5001"
    volumes:
      - mlflow_data:/mlflow

  app:
    build: .
    container_name: app
    depends_on:
      weaviate:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./dataset:/dataset
      - shared_data:/app/data
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - WEAVIATE_HOST=weaviate
      - WEAVIATE_PORT=8080
    env_file:
      - .env

  chatbot:
    build:
      context: ../Frontend
      dockerfile: Dockerfile
    container_name: chatbot
    ports:
      - "8000:8000"
    depends_on:
      weaviate:
        condition: service_healthy
      ollama:
        condition: service_started
      neo4j:
        condition: service_healthy
      mlflow:
        condition: service_started
    env_file:
      - .env
    environment:
      - PIPELINE_DATA_PATH=/app/pipeline_data
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
    volumes:
      - shared_data:/app/data
      - ../Pipeline:/app/pipeline_data
      - ./dataset:/dataset
      - .:/app/weaviate_app:ro
      - ../Frontend/static:/app/static

volumes:
  weaviate_data:
  neo4j_data:
  mlflow_data:
  shared_data:
  ollama_models:
