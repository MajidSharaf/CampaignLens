<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CampaignLens — Boxing</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1A4494;--blue-bg:#EEF3FB;--blue-border:rgba(26,68,148,.18);
  --red:#B01C2E;--red-bg:#FCEEEE;--red-border:rgba(176,28,46,.18);
  --text:#0A0F1E;--muted:#6B7280;--border:#D4D8E1;--bg:#FFFFFF;--surface:#F7F8FA;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;display:flex;flex-direction:column}

nav{display:flex;align-items:center;gap:1rem;padding:0 1.5rem;height:52px;border-bottom:1px solid var(--border);flex-shrink:0}
.wordmark{font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase}
.wordmark span{color:var(--blue)}
.back{height:30px;padding:0 .75rem;border:1px solid var(--border);background:none;color:var(--muted);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:5px;text-decoration:none;transition:color .15s,border-color .15s}
.back:hover{color:var(--text);border-color:var(--text)}
.nav-right{display:flex;gap:1.25rem;margin-left:auto;align-items:center}
.nav-link{font-size:12px;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:4px;transition:color .15s}
.nav-link:hover{color:var(--text)}

/* setup bar */
.setup-bar{padding:.75rem 1.5rem;border-bottom:1px solid var(--border);background:var(--surface);display:flex;gap:.75rem;align-items:center;flex-shrink:0}
.setup-bar input{flex:1;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:14px;padding:.45rem .75rem;outline:none;transition:border-color .15s}
.setup-bar input:focus{border-color:var(--blue)}
.rounds-label{font-size:12px;color:var(--muted);white-space:nowrap}
.rounds-select{border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;padding:.4rem .5rem;cursor:pointer;outline:none}
.start-btn{height:36px;padding:0 1.25rem;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;transition:opacity .15s}
.start-btn:hover{opacity:.85}
.start-btn:disabled{opacity:.4;cursor:not-allowed}

/* ring */
.ring-wrap{flex:1;overflow-y:auto;padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:0}
.ring-wrap::-webkit-scrollbar{width:3px}
.ring-wrap::-webkit-scrollbar-thumb{background:var(--border)}

/* empty */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;color:var(--muted);text-align:center;padding:2rem}
.empty-icon{font-size:40px;opacity:.2;margin-bottom:.5rem}
.empty strong{font-size:14px;font-weight:600;color:var(--text);opacity:.4}
.empty p{font-size:12px;max-width:28ch}

/* round header */
.round-header{display:flex;align-items:center;gap:.75rem;margin:1.25rem 0 .6rem;user-select:none}
.round-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.round-line{flex:1;height:1px;background:var(--border)}

/* statement cards */
.statement{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:.75rem}
.card{padding:.9rem 1rem;border-left:3px solid transparent;background:var(--surface)}
.card.supporter{border-left-color:var(--blue);background:var(--blue-bg)}
.card.critic{border-left-color:var(--red);background:var(--red-bg)}
.card-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.45rem}
.persona-tag{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.card.supporter .persona-tag{color:var(--blue)}
.card.critic .persona-tag{color:var(--red)}
.conf-pill{margin-left:auto;font-size:10px;font-family:"SF Mono","Fira Code",monospace;padding:2px 6px;border:1px solid;border-radius:2px}
.card.supporter .conf-pill{color:var(--blue);border-color:var(--blue-border)}
.card.critic .conf-pill{color:var(--red);border-color:var(--red-border)}
.card-body{font-size:13px;line-height:1.6;color:var(--text)}
.card-sources{margin-top:.5rem;display:flex;flex-wrap:wrap;gap:3px}
.src-tag{font-size:10px;font-family:"SF Mono","Fira Code",monospace;color:var(--muted);border:1px solid var(--border);padding:1px 5px;background:var(--bg)}

/* typing */
.typing-card{padding:.75rem 1rem;background:var(--surface);border-left:3px solid var(--border);display:flex;align-items:center;gap:6px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:pulse 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,60%,100%{opacity:.3}30%{opacity:1}}

/* vs divider */
.vs{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-align:center;align-self:center;flex-shrink:0}
</style>
</head>
<body>

<nav>
  <a class="back" href="/"><i class="ti ti-arrow-left"></i> Back</a>
  <div class="wordmark">Campaign<span>Lens</span> <span style="color:var(--muted);font-weight:400">— Boxing</span></div>
  <div class="nav-right">
    <a class="nav-link" href="/chat"><i class="ti ti-messages"></i> Chat</a>
    <a class="nav-link" href="/analysis"><i class="ti ti-chart-bar"></i> Analysis</a>
  </div>
</nav>

<div class="setup-bar">
  <input id="topicInput" placeholder="Enter a debate topic, e.g. "Trump's economic policy"" />
  <span class="rounds-label">Rounds</span>
  <select class="rounds-select" id="roundsSelect">
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3" selected>3</option>
    <option value="4">4</option>
    <option value="5">5</option>
  </select>
  <button class="start-btn" id="startBtn" onclick="startDebate()">
    <i class="ti ti-boxing-glove"></i> Start
  </button>
</div>

<div class="ring-wrap" id="ring">
  <div class="empty" id="emptyState">
    <div class="empty-icon"><i class="ti ti-boxing-glove"></i></div>
    <strong>The ring is empty</strong>
    <p>Enter a topic and hit Start to begin the debate</p>
  </div>
</div>

<script>
async function startDebate() {
  const topic = document.getElementById('topicInput').value.trim();
  if (!topic) return;
  const rounds = parseInt(document.getElementById('roundsSelect').value);
  const btn = document.getElementById('startBtn');
  const ring = document.getElementById('ring');

  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2" style="animation:spin 1s linear infinite"></i> Fighting…';
  ring.innerHTML = '<style>@keyframes spin{to{transform:rotate(360deg)}}</style>';

  // Show all placeholders upfront
  for (let r = 1; r <= rounds; r++) {
    ring.appendChild(roundHeader(r));
    const row = document.createElement('div');
    row.className = 'statement';
    row.innerHTML = `
      <div class="typing-card" id="pc-${r}"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <div class="typing-card" id="ps-${r}"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
    ring.appendChild(row);
  }

  try {
    const res = await fetch('/api/debate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({topic, rounds})
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();

    // Render each turn one by one with a short delay for visual effect
    for (const entry of data.rounds) {
      await new Promise(r => setTimeout(r, 300));
      const id = entry.persona === 'critic' ? `pc-${entry.round}` : `ps-${entry.round}`;
      const placeholder = document.getElementById(id);
      if (placeholder) placeholder.replaceWith(makeCard(entry.persona, entry));
      ring.scrollTop = ring.scrollHeight;
    }
  } catch(e) {
    ring.innerHTML = `<div class="empty"><strong>Error</strong><p>${esc(String(e))}</p></div>`;
  }

  btn.disabled = false;
  btn.innerHTML = '<i class="ti ti-boxing-glove"></i> Start';
}

function renderDebate(data) {
  const ring = document.getElementById('ring');
  ring.innerHTML = '';

  // group by round number
  const byRound = {};
  for (const entry of data.rounds) {
    if (!byRound[entry.round]) byRound[entry.round] = {};
    byRound[entry.round][entry.persona] = entry;
  }

  for (const [r, entries] of Object.entries(byRound)) {
    ring.appendChild(roundHeader(parseInt(r)));
    const row = document.createElement('div');
    row.className = 'statement';
    // critic attacks (left), supporter defends (right)
    row.appendChild(makeCard('critic', entries.critic));
    row.appendChild(makeCard('supporter', entries.supporter));
    ring.appendChild(row);
  }

  ring.scrollTop = ring.scrollHeight;
}

function makeCard(persona, entry) {
  const conf = entry ? Math.round(entry.confidence * 100) : 0;
  const srcs = entry?.sources || [];
  const srcHtml = srcs.map(s => `<span class="src-tag">${esc(s)}</span>`).join('');
  const div = document.createElement('div');
  div.className = `card ${persona}`;
  div.innerHTML = `
    <div class="card-head">
      <span class="persona-tag">${persona}</span>
      <span class="conf-pill">${conf}% confidence</span>
    </div>
    <div class="card-body">${esc(entry?.response || '—')}</div>
    ${srcs.length ? `<div class="card-sources">${srcHtml}</div>` : ''}
  `;
  return div;
}

function roundHeader(n) {
  const div = document.createElement('div');
  div.className = 'round-header';
  div.innerHTML = `<div class="round-line"></div><span class="round-label">Round ${n}</span><div class="round-line"></div>`;
  return div;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('topicInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') startDebate();
});
</script>
</body>
</html>
